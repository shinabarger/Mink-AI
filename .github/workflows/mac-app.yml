   # Builds Mink.dmg on GitHub's Mac machines.
   #   Test build: Actions tab > Build Mac app > Run workflow. The DMG is under "Artifacts" on the run page.
   #   Release:    publish a release on GitHub. The DMG is attached to it automatically.
   name: Build Mac app

   on:
     release:
       types: [published]
     workflow_dispatch:

   permissions:
     contents: write  # To attach the DMG to the release

   jobs:
     build:
       runs-on: macos-14  # Apple Silicon
       steps:
         - uses: actions/checkout@v4

         - name: Build Mink.app and Mink.dmg
           env:
             # Optional. Leave these secrets unset to build an ad-hoc signed app.
             MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
             MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
             APPLE_ID: ${{ secrets.APPLE_ID }}
             APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
             APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
           run: bash packaging/macos/build_app.sh

         - uses: actions/upload-artifact@v4
           with:
             name: Mink-dmg
             path: dist/Mink.dmg

         - name: Attach to the release
           if: github.event_name == 'release'
           env:
             GH_TOKEN: ${{ github.token }}
           run: gh release upload "${{ github.event.release.tag_name }}" dist/Mink.dmg --clobber
